; PHP Configuration for Multiple File Uploads
; Increase these values based on your needs

; Maximum size of POST data that PHP will accept (increased for multiple images)
post_max_size = 120M

; Maximum allowed size for uploaded files
upload_max_filesize = 25M

; Maximum number of files that can be uploaded via a single request
max_file_uploads = 20

; Maximum amount of time each script may spend parsing request data
max_input_time = 300

; Maximum execution time of each script, in seconds
max_execution_time = 300

; Maximum amount of memory a script may consume
memory_limit = 512M

; Maximum input variable nesting level
max_input_nesting_level = 128

; Maximum number of variables your server can accept
max_input_vars = 3000 