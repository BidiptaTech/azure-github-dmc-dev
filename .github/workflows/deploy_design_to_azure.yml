name: React Deploy Design Staging to Azure

on:
  push:
    branches:
      - design_staging

permissions:
  contents: write
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - name: 📥 Checkout Design Staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Install React dependencies
        run: |
          npm ci
          npm install @vitejs/plugin-react --save-dev || echo "Plugin already installed"
          npm rebuild @swc/core || echo "SWC rebuild failed, will try alternative approach"

      - name: 🔧 Prepare Vite config for CI
        run: |
          cp vite.config.js vite.config.js.backup || true
          cat > vite.config.js << 'EOF'
          import { defineConfig } from 'vite'
          import react from '@vitejs/plugin-react'
          import path from 'path'
          
          export default defineConfig({
            plugins: [react()],
            resolve: {
              alias: {
                '@': path.resolve(__dirname, './src'),
                '~': path.resolve(__dirname, './src')
              }
            },
            build: {
              outDir: 'build',
              sourcemap: false,
              minify: 'terser'
            },
            server: {
              port: 3000
            }
          })
          EOF
          echo "✅ CI-friendly Vite config created"

      - name: 🏗️ Build React application
        run: |
          rm -rf build dist
          npm run build
          echo "✅ React build completed"

      - name: 🔄 Restore original Vite config
        run: |
          mv vite.config.js.backup vite.config.js || echo "No backup to restore"

      - name: 🗂️ Prepare deployment folder
        run: |
          echo "📁 Preparing deployment folder..."
          rm -rf deployment
          mkdir -p deployment
          cp -r build/* deployment/
          if [ -d public ]; then
            cp -r public/* deployment/ 2>/dev/null || true
          fi
          echo "✅ React build files prepared for deployment"

      - name: 🔧 Create .htaccess for React routing
        run: |
          cat > deployment/.htaccess << 'EOF'
          # React.js SPA routing configuration
          RewriteEngine On
          RewriteCond %{REQUEST_FILENAME} -f [OR]
          RewriteCond %{REQUEST_FILENAME} -d
          RewriteRule ^ - [L]
          RewriteRule ^ /index.html [L]
          <IfModule mod_headers.c>
              Header always set X-Content-Type-Options nosniff
              Header always set X-Frame-Options SAMEORIGIN
              Header always set X-XSS-Protection "1; mode=block"
              Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
          </IfModule>
          <IfModule mod_deflate.c>
              AddOutputFilterByType DEFLATE text/plain text/html text/xml text/css application/xml application/xhtml+xml application/rss+xml application/javascript application/x-javascript
          </IfModule>
          <IfModule mod_expires.c>
              ExpiresActive On
              ExpiresByType text/css "access plus 1 year"
              ExpiresByType application/javascript "access plus 1 year"
              ExpiresByType image/png "access plus 1 year"
              ExpiresByType image/jpg "access plus 1 year"
              ExpiresByType image/jpeg "access plus 1 year"
              ExpiresByType image/gif "access plus 1 year"
              ExpiresByType image/svg+xml "access plus 1 year"
              ExpiresByType application/pdf "access plus 1 month"
              ExpiresByType text/html "access plus 0 seconds"
          </IfModule>
          EOF
          echo "✅ .htaccess file created for React routing"

      - name: 🔍 Create React deployment info
        run: |
          cat > deployment/react-deployment-info.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <title>React Deployment Info</title>
              <style>
                  body { font-family: Arial, sans-serif; margin: 20px; }
                  .info { background: #f0f8ff; padding: 15px; border-radius: 5px; }
                  .success { color: #28a745; }
                  .warning { color: #ffc107; }
              </style>
          </head>
          <body>
              <h2>React Deployment Information</h2>
              <div class="info">
                  <h3 class="success">✅ React Application Deployed Successfully</h3>
                  <p><strong>Deployment Date:</strong> <?php echo date('Y-m-d H:i:s'); ?></p>
                  <p><strong>Branch:</strong> design_staging</p>
                  <p><strong>Build:</strong> Production</p>
                  <h3>📁 Preserved Files & Folders:</h3>
                  <ul>
                      <li>✅ default file</li>
                      <li>✅ backadm-dmc folder (complete)</li>
                  </ul>
                  <h3>🎯 Access Points:</h3>
                  <ul>
                      <li><strong>React App:</strong> <a href="/">Main Application</a></li>
                      <li><strong>Laravel Admin:</strong> <a href="/backadm-dmc/">Backend Admin</a></li>
                  </ul>
              </div>
          </body>
          </html>
          EOF
          echo "✅ React deployment info created"

      - name: 🔐 Prepare Kudu credentials
        id: kudu-creds
        env:
          AZURE_PUBLISH_PROFILE: ${{ secrets.AZURE_PUBLISH_PROFILE }}
        run: |
          printf "%s" "$AZURE_PUBLISH_PROFILE" | base64 -d > pf.xml 2>/dev/null || printf "%s" "$AZURE_PUBLISH_PROFILE" > pf.xml
          USER=$(sed -n 's/.*publishMethod="MSDeploy"[^>]*userName="\([^"]*\)".*/\1/p' pf.xml)
          PASS=$(sed -n 's/.*publishMethod="MSDeploy"[^>]*userPWD="\([^"]*\)".*/\1/p' pf.xml)
          echo "user=$USER" >> $GITHUB_OUTPUT
          echo "pass=$PASS" >> $GITHUB_OUTPUT

      - name: 📦 Create React deployment zip
        run: |
          cd deployment
          zip -r ../react.zip .
          cd -

      - name: 🚀 Deploy React to root via Kudu ZIP push (non-destructive)
        env:
          APP_NAME: dmc-app-dev
          KUDU_USER: ${{ steps.kudu-creds.outputs.user }}
          KUDU_PASS: ${{ steps.kudu-creds.outputs.pass }}
        run: |
          curl -sS -u "${KUDU_USER}:${KUDU_PASS}" -X PUT \
            "https://${APP_NAME}.scm.azurewebsites.net/api/zip/" \
            -H "Content-Type: application/zip" --data-binary @react.zip

      - name: 🎉 Deployment Summary
        run: |
          echo "🎯 React app deployed to root without touching backadm-dmc/default."

