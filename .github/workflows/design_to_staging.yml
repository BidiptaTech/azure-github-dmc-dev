name: Sync design_staging into staging (excluding protected folders/files)

on:
  push:
    branches:
      - design_staging

permissions:
  contents: write  # Required to allow pushing changes

jobs:
  sync-design:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout design_staging branch
        uses: actions/checkout@v4
        with:
          ref: design_staging
          path: design_staging
          fetch-depth: 0  # Full history to avoid commit errors

      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: staging
          path: staging
          fetch-depth: 0  # Full history to support rebase

      - name: Copy files to staging root (excluding protected files/folders)
        run: |
          rsync -av \
            --exclude='backadm-dmc/' \
            --exclude='.htaccess' \
            --exclude='laravel-debug.php' \
            --exclude='startup.sh' \
            design_staging/ staging/

      - name: Commit and push to staging
        run: |
          cd staging
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add .
          # Unstage protected files just in case
          git reset backadm-dmc .htaccess laravel-debug.php startup.sh || true

          git commit -m "Auto-sync from design_staging to staging on $(date)" || echo "No changes to commit"

          # ✅ Pull latest changes to avoid non-fast-forward error
          git pull origin staging --rebase

          # ✅ Push using your personal access token (PAT)
          git push https://x-access-token:${{ secrets.STAGING_GH_PAT }}@github.com/${{ github.repository }} HEAD:staging
