name: Sync design_staging into staging (excluding protected folders/files)

on:
  push:
    branches:
      - design_staging

permissions:
  contents: write  # Required for git push

jobs:
  sync-design:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout design_staging branch
        uses: actions/checkout@v4
        with:
          ref: design_staging
          path: design_staging
          fetch-depth: 0  # ✅ Needed to avoid history/commit errors

      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: staging
          path: staging
          fetch-depth: 0  # ✅ Needed for correct history during commit

      - name: Copy files to staging root (excluding protected files/folders)
        run: |
          rsync -av \
            --exclude='backadm-dmc/' \
            --exclude='.htaccess' \
            --exclude='laravel-debug.php' \
            --exclude='startup.sh' \
            design_staging/ staging/

      - name: Commit and push to staging
        run: |
          cd staging
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add .

          # Ensure protected files/folders are not included in commit
          git reset backadm-dmc .htaccess laravel-debug.php startup.sh || true

          git commit -m "Auto-sync from design_staging to staging on $(date)" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.STAGING_GH_PAT }}@github.com/${{ github.repository }} HEAD:staging
