name: Build and Deploy PHP App to Azure Web App - dmc-app-dev

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Check if composer.json exists
        id: check_files
        uses: andstor/file-existence-action@v1
        with:
          files: 'backadm-dmc/composer.json'

      - name: Run composer install if composer.json exists
        if: steps.check_files.outputs.files_exists == 'true'
        run: |
          cd backadm-dmc
          composer validate --no-check-publish
          composer install --prefer-dist --no-progress --no-dev --optimize-autoloader

      - name: Create ZIP for deployment
        run: |
          # Create zip excluding unnecessary files
          zip -r release.zip . \
            -x ".git/*" \
            -x "node_modules/*" \
            -x "tests/*" \
            -x "*.md" \
            -x ".github/*" \
            -x ".gitignore" \
            -x ".gitattributes" \
            -x ".editorconfig" \
            -x "phpunit.xml" \
            -x "vite.config.js" \
            -x "package*.json"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: php-app

      - name: Unzip release
        run: unzip release.zip

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 🧹 Enhanced selective cleanup - Remove ONLY Laravel files, preserve React
        run: |
          echo "🧹 Performing enhanced selective cleanup of Laravel-specific files..."
          echo "🛡️ PRESERVING ALL REACT FILES - Only removing Laravel components"
          
          # Create cleanup script
          cat > cleanup_script.sh << 'EOF'
          #!/bin/bash
          echo "🔄 Stopping PHP processes to unlock files..."
          pkill -f php || true
          
          echo "🗂️ Removing backadm-dmc folder completely..."
          rm -rf /home/site/wwwroot/backadm-dmc || echo "backadm-dmc folder not found"
          
          echo "🔍 Verifying backadm-dmc removal..."
          if [ ! -d /home/site/wwwroot/backadm-dmc ]; then
            echo "✅ backadm-dmc successfully deleted"
          else
            echo "❌ WARNING: backadm-dmc still exists"
          fi
          
          echo "📄 Removing Laravel-specific files from root..."
          rm -f /home/site/wwwroot/default || echo "default file not found"
          rm -f /home/site/wwwroot/laravel-debug.php || echo "laravel-debug.php not found"
          rm -f /home/site/wwwroot/startup.sh || echo "startup.sh not found"
          rm -f /home/site/wwwroot/nginx-default || echo "nginx-default not found"
          rm -f /home/site/wwwroot/artisan || echo "artisan not found"
          rm -f /home/site/wwwroot/composer.json || echo "composer.json not found"
          rm -f /home/site/wwwroot/composer.lock || echo "composer.lock not found"
          
          echo "💨 Clearing PHP and Laravel caches..."
          rm -rf /tmp/opcache-* || true
          rm -rf /home/.composer/cache/* || true
          
          echo "📁 Listing remaining files in wwwroot (React files should be preserved):"
          ls -la /home/site/wwwroot/ || echo "Could not list files"
          
          echo "🔍 Final verification:"
          if [ ! -d /home/site/wwwroot/backadm-dmc ]; then
            echo "✅ SUCCESS: backadm-dmc completely removed"
          else
            echo "❌ ERROR: backadm-dmc still exists!"
          fi
          
          file_count=$(ls -1 /home/site/wwwroot/ 2>/dev/null | wc -l)
          echo "📊 Files remaining in root: $file_count (React files should be here)"
          
          echo "✅ Enhanced selective cleanup completed!"
          EOF
          
          # Upload and execute the cleanup script
          az webapp deploy \
            --resource-group rg-dmc-app-dev \
            --name dmc-app-dev \
            --src-path cleanup_script.sh \
            --type script \
            --target-path /home/cleanup_script.sh
          
          # Execute the cleanup script
          az webapp ssh \
            --resource-group rg-dmc-app-dev \
            --name dmc-app-dev \
            --command "chmod +x /home/cleanup_script.sh && /home/cleanup_script.sh"

      - name: 🚀 Deploy Laravel files without --clean flag
        run: |
          echo "🚀 Deploying fresh Laravel files (preserving React files)..."
          
          # Deploy WITHOUT --clean flag to preserve React files
          az webapp deploy \
            --resource-group rg-dmc-app-dev \
            --name dmc-app-dev \
            --src-path release.zip \
            --type zip
          
          echo "✅ Laravel deployment completed - React files preserved!"

      - name: 📋 Verify deployment structure and check for Azure Key Vault files
        run: |
          echo "📋 Verifying deployment structure..."
          
          # Create verification script
          cat > verify_script.sh << 'EOF'
          #!/bin/bash
          echo "🔍 Checking for Laravel files:"
          ls -la /home/site/wwwroot/backadm-dmc/ || echo "Laravel files not found"
          
          echo "🔍 Checking for React files in root:"
          ls -la /home/site/wwwroot/ | grep -E '\.(js|css|html|json)$' || echo "No React files found in root"
          
          echo "🔍 Checking for Azure Key Vault files (should be NONE):"
          cd /home/site/wwwroot/backadm-dmc
          find . -name '*KeyVault*' -o -name '*AzureKeyVault*' 2>/dev/null && echo "❌ WARNING: Azure Key Vault files found!" || echo "✅ SUCCESS: No Azure Key Vault files found"
          
          echo "🔍 Checking Laravel services directory:"
          ls -la app/Services/ 2>/dev/null || echo "No app/Services directory (expected for clean deployment)"
          
          echo "✅ Structure verification completed!"
          EOF
          
          # Upload and execute verification script
          az webapp deploy \
            --resource-group rg-dmc-app-dev \
            --name dmc-app-dev \
            --src-path verify_script.sh \
            --type script \
            --target-path /home/verify_script.sh
          
          az webapp ssh \
            --resource-group rg-dmc-app-dev \
            --name dmc-app-dev \
            --command "chmod +x /home/verify_script.sh && /home/verify_script.sh"

      - name: Post-deployment Laravel setup and optimization
        run: |
          echo "🔧 Running post-deployment Laravel setup on Azure..."
          
          # Create setup script
          cat > setup_script.sh << 'EOF'
          #!/bin/bash
          echo "🔧 Creating NGINX configuration..."
          cat > /home/site/nginx-default << 'NGINXEOF'
          server {
              listen 8080;
              listen [::]:8080;
              root /home/site/wwwroot;
              index index.php index.html index.htm;
              server_name _;
              
              # Handle React frontend (root directory) - SPA routing
              location / {
                  try_files $uri $uri/ /index.html;
              }
              
              # Handle Laravel admin (subdirectory)
              location /backadm-dmc {
                  alias /home/site/wwwroot/backadm-dmc/public;
                  try_files $uri $uri/ @laravel;
                  
                  location ~ \.php$ {
                      include fastcgi_params;
                      fastcgi_param SCRIPT_FILENAME $request_filename;
                      fastcgi_pass 127.0.0.1:9000;
                  }
              }
              
              location @laravel {
                  rewrite /backadm-dmc/(.*)$ /backadm-dmc/index.php?$1 last;
              }
          }
          NGINXEOF
          
          # Copy NGINX configuration
          cp /home/site/nginx-default /etc/nginx/sites-available/default || true
          
          # Test and reload NGINX
          nginx -t && service nginx reload || true
          
          # Create necessary Laravel directories
          cd /home/site/wwwroot/backadm-dmc
          mkdir -p storage/framework/{sessions,views,cache} || true
          mkdir -p storage/logs || true
          mkdir -p storage/app/{public,uploads} || true
          mkdir -p bootstrap/cache || true
          
          # Set proper permissions for Linux
          chmod -R 775 storage || true
          chmod -R 775 bootstrap/cache || true
          
          # Clear all existing caches first
          php artisan optimize:clear || true
          
          # Create storage link
          php artisan storage:link || true
          
          # Laravel optimizations
          php artisan config:cache || true
          php artisan route:cache || true
          php artisan view:cache || true
          
          echo "✅ Post-deployment Laravel setup completed"
          EOF
          
          # Upload and execute setup script
          az webapp deploy \
            --resource-group rg-dmc-app-dev \
            --name dmc-app-dev \
            --src-path setup_script.sh \
            --type script \
            --target-path /home/setup_script.sh
          
          az webapp ssh \
            --resource-group rg-dmc-app-dev \
            --name dmc-app-dev \
            --command "chmod +x /home/setup_script.sh && /home/setup_script.sh"

      - name: Restart Azure Web App
        run: |
          echo "🔄 Restarting Azure Web App..."
          az webapp restart --resource-group rg-dmc-app-dev --name dmc-app-dev
          echo "✅ Azure Web App restarted successfully"

      - name: Deployment Summary
        run: |
          echo "🎉 Enhanced selective deployment completed successfully!"
          echo ""
          echo "🌐 Application URLs:"
          echo "   React Frontend: https://dev.travclicks.com/"
          echo "   Laravel Admin:  https://dev.travclicks.com/backadm-dmc/"
          echo ""
          echo "✅ Enhanced deployment flow:"
          echo "   1. ✅ Code built and zipped"
          echo "   2. 🧹 Enhanced selective cleanup:"
          echo "      - 🗑️ DELETED: backadm-dmc/ folder (COMPLETELY)"
          echo "      - 🗑️ DELETED: default file"
          echo "      - 🗑️ DELETED: laravel-debug.php"  
          echo "      - 🗑️ DELETED: startup.sh"
          echo "      - 🗑️ DELETED: nginx-default file"
          echo "      - 💨 CLEARED: PHP opcache"
          echo "      - 💨 CLEARED: Composer cache"
          echo "      - 🛡️ PRESERVED: ALL React files in root"
          echo "   3. 🚀 Fresh Laravel deployed (without --clean)"
          echo "   4. 🔍 Verified NO Azure Key Vault files exist"
          echo "   5. 📁 Laravel directories created"
          echo "   6. 🔧 Proper permissions set"
          echo "   7. 🧹 Laravel caches cleared"
          echo "   8. 🔗 Storage link created"
          echo "   9. ⚡ Laravel optimizations applied"
          echo "   10. 🔄 Web app restarted"
          echo ""
          echo "🛡️ React files are completely safe!"
          echo "🚀 Azure Key Vault integration completely removed!"
