name: Build and Deploy PHP App to Azure Web App - dmc-app-dev

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: 🧩 Laravel Backend Deployment (backadm-dmc)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: 📥 Checkout DEV Main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Setup PHP for Laravel
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: 🔧 Install Composer Globally
        run: |
          curl -sS https://getcomposer.org/installer | php
          mv composer.phar /usr/local/bin/composer

      - name: 📦 Install Laravel Dependencies
        working-directory: backadm-dmc
        run: |
          composer validate --no-check-publish
          composer install --prefer-dist --no-dev --optimize-autoloader

      - name: 🗂️ Ensure storage directories exist (pre-deploy)
        run: |
          set -e
          mkdir -p backadm-dmc/storage/app/public
          mkdir -p backadm-dmc/storage/framework/{cache,sessions,testing,views}
          mkdir -p backadm-dmc/storage/logs
          # Pre-create a writable file so logs can initialize
          touch backadm-dmc/storage/logs/laravel.log

      - name: 🗂️ Prepare deployment package (Laravel only)
        run: |
          echo "📁 Preparing Laravel-only deployment package..."
          rm -rf deployment
          mkdir -p deployment
          cp -r backadm-dmc deployment/backadm-dmc
          echo "✅ Package contains only backadm-dmc to avoid touching React root"

      - name: 🔐 Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 🚀 Deploy Laravel folder to Azure Web App (dmc-app-dev)
        uses: azure/webapps-deploy@v3
        with:
          app-name: dmc-app-dev
          slot-name: Production
          package: ./deployment

      - name: 🔧 Post-deploy Laravel maintenance (best-effort)
        if: ${{ secrets.AZURE_PUBLISH_PROFILE != '' }}
        env:
          AZURE_PUBLISH_PROFILE: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          APP_NAME: dmc-app-dev
        run: |
          echo "⚙️ Running post-deploy maintenance via Kudu (best-effort)"
          python3 - << 'PY'
import os, base64, xml.etree.ElementTree as ET, subprocess
pf = os.environ.get('AZURE_PUBLISH_PROFILE', '')
if not pf:
    raise SystemExit(0)
xml = base64.b64decode(pf.encode()).decode('utf-8') if pf.strip().startswith(('PD94','PFR1')) else pf
root = ET.fromstring(xml)
user = root.find('.//publishProfile[@publishMethod="MSDeploy"]').get('userName')
pwd  = root.find('.//publishProfile[@publishMethod="MSDeploy"]').get('userPWD')
app  = os.environ['APP_NAME']
def kudu(cmd):
    url = f"https://{app}.scm.azurewebsites.net/api/command"
    subprocess.run(['curl','-sS','-u',f'{user}:{pwd}','-X','POST',url,'-d',cmd,'-H','Content-Type:text/plain'], check=False)
commands = [
  'set -e; cd /home/site/wwwroot; mkdir -p backadm-dmc/storage/app/public backadm-dmc/storage/framework/cache backadm-dmc/storage/framework/sessions backadm-dmc/storage/framework/testing backadm-dmc/storage/framework/views backadm-dmc/storage/logs; touch backadm-dmc/storage/logs/laravel.log; chmod -R 775 backadm-dmc/storage || true',
  'cd /home/site/wwwroot/backadm-dmc && php artisan config:cache || true',
  'cd /home/site/wwwroot/backadm-dmc && php artisan route:cache || true',
  'cd /home/site/wwwroot/backadm-dmc && php artisan view:cache || true',
  'cd /home/site/wwwroot/backadm-dmc && php artisan storage:link || true'
]
for c in commands:
    kudu(c)
PY

      - name: ✅ Verify Laravel endpoint
        run: |
          sleep 10
          curl -f https://dev.travclicks.com/backadm-dmc/ || echo "Laravel may still be warming up"

      - name: ✅ Deployment Summary
        run: |
          echo "🎉 Laravel deployment (backadm-dmc) completed."
          echo "→ Deployed only /backadm-dmc to avoid affecting React root."
          echo "→ Ensured storage directories exist and attempted to set permissions."
