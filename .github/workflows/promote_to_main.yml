name: Build and Deploy PHP App to Azure Web App - dmc-app-dev

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Check if composer.json exists
        id: check_files
        uses: andstor/file-existence-action@v1
        with:
          files: 'backadm-dmc/composer.json'

      - name: Run composer install if composer.json exists
        if: steps.check_files.outputs.files_exists == 'true'
        run: |
          cd backadm-dmc
          composer validate --no-check-publish
          composer install --prefer-dist --no-progress --no-dev --optimize-autoloader

      - name: Create ZIP for deployment
        run: |
          # Create zip excluding unnecessary files
          zip -r release.zip . \
            -x ".git/*" \
            -x "node_modules/*" \
            -x "tests/*" \
            -x "*.md" \
            -x ".github/*" \
            -x ".gitignore" \
            -x ".gitattributes" \
            -x ".editorconfig" \
            -x "phpunit.xml" \
            -x "vite.config.js" \
            -x "package*.json"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: php-app

      - name: Unzip release
        run: unzip release.zip

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 🧹 Enhanced selective cleanup - Remove ONLY Laravel files, preserve React
        run: |
          echo "🧹 Performing enhanced selective cleanup of Laravel-specific files..."
          echo "🛡️ PRESERVING ALL REACT FILES - Only removing Laravel components"
          
          # Stop any running PHP processes that might lock files
          echo "🔄 Stopping PHP processes to unlock files..."
          az webapp ssh --resource-group rg-dmc-app-dev --name dmc-app-dev --command "pkill -f php || true" || echo "No PHP processes to kill"
          
          # Wait a moment for processes to stop
          sleep 2
          
          # STEP 1: Remove backadm-dmc folder COMPLETELY with force
          echo "🗂️ Removing backadm-dmc folder completely..."
          az webapp ssh --resource-group rg-dmc-app-dev --name dmc-app-dev --command "rm -rf /home/site/wwwroot/backadm-dmc" || echo "backadm-dmc folder not found"
          
          # STEP 2: Double-check backadm-dmc is completely gone
          echo "🔍 Verifying backadm-dmc removal..."
          az webapp ssh --resource-group rg-dmc-app-dev --name dmc-app-dev --command "[ ! -d /home/site/wwwroot/backadm-dmc ] && echo '✅ backadm-dmc successfully deleted' || echo '❌ WARNING: backadm-dmc still exists'"
          
          # STEP 3: Remove the 3 specific Laravel-related files from root
          echo "📄 Removing Laravel-specific files from root..."
          az webapp ssh --resource-group rg-dmc-app-dev --name dmc-app-dev --command "rm -f /home/site/wwwroot/default" || echo "default file not found"
          az webapp ssh --resource-group rg-dmc-app-dev --name dmc-app-dev --command "rm -f /home/site/wwwroot/laravel-debug.php" || echo "laravel-debug.php not found"
          az webapp ssh --resource-group rg-dmc-app-dev --name dmc-app-dev --command "rm -f /home/site/wwwroot/startup.sh" || echo "startup.sh not found"
          
          # STEP 4: Remove any additional Laravel-related files that might exist
          echo "🧹 Removing additional Laravel-related files..."
          az webapp ssh --resource-group rg-dmc-app-dev --name dmc-app-dev --command "rm -f /home/site/wwwroot/nginx-default" || echo "nginx-default not found"
          az webapp ssh --resource-group rg-dmc-app-dev --name dmc-app-dev --command "rm -f /home/site/wwwroot/artisan" || echo "artisan not found"
          az webapp ssh --resource-group rg-dmc-app-dev --name dmc-app-dev --command "rm -f /home/site/wwwroot/composer.json" || echo "composer.json not found"
          az webapp ssh --resource-group rg-dmc-app-dev --name dmc-app-dev --command "rm -f /home/site/wwwroot/composer.lock" || echo "composer.lock not found"
          
          # STEP 5: Clear PHP and Laravel caches that might contain old code
          echo "💨 Clearing PHP and Laravel caches..."
          az webapp ssh --resource-group rg-dmc-app-dev --name dmc-app-dev --command "rm -rf /tmp/opcache-* || true" || echo "No opcache files to remove"
          az webapp ssh --resource-group rg-dmc-app-dev --name dmc-app-dev --command "rm -rf /home/.composer/cache/* || true" || echo "No composer cache to clear"
          
          # STEP 6: List remaining files to confirm React files are preserved
          echo "📁 Listing remaining files in wwwroot (React files should be preserved):"
          az webapp ssh --resource-group rg-dmc-app-dev --name dmc-app-dev --command "ls -la /home/site/wwwroot/" || echo "Could not list files"
          
          # STEP 7: Final verification
          echo "🔍 Final verification - checking what was removed vs preserved:"
          az webapp ssh --resource-group rg-dmc-app-dev --name dmc-app-dev --command "ls -la /home/site/wwwroot/backadm-dmc 2>/dev/null && echo '❌ ERROR: backadm-dmc still exists!' || echo '✅ SUCCESS: backadm-dmc completely removed'"
          
          # Count remaining files to ensure React files are still there
          az webapp ssh --resource-group rg-dmc-app-dev --name dmc-app-dev --command "file_count=\$(ls -1 /home/site/wwwroot/ 2>/dev/null | wc -l); echo \"📊 Files remaining in root: \$file_count (React files should be here)\""
          
          echo "✅ Enhanced selective cleanup completed!"
          echo "🛡️ React files in root directory are completely preserved!"
          echo "🗑️ Removed: backadm-dmc/ + 3 Laravel files + caches"

      - name: 🚀 Deploy Laravel files without --clean flag
        run: |
          echo "🚀 Deploying fresh Laravel files (preserving React files)..."
          
          # Deploy WITHOUT --clean flag to preserve React files
          az webapp deploy \
            --resource-group rg-dmc-app-dev \
            --name dmc-app-dev \
            --src-path release.zip \
            --type zip
          
          echo "✅ Laravel deployment completed - React files preserved!"

      - name: 📋 Verify deployment structure and check for Azure Key Vault files
        run: |
          echo "📋 Verifying deployment structure..."
          
          # Check that Laravel files exist
          echo "🔍 Checking for Laravel files:"
          az webapp ssh --resource-group rg-dmc-app-dev --name dmc-app-dev --command "ls -la /home/site/wwwroot/backadm-dmc/" || echo "Laravel files not found"
          
          # Check for React files in root
          echo "🔍 Checking for React files in root:"
          az webapp ssh --resource-group rg-dmc-app-dev --name dmc-app-dev --command "ls -la /home/site/wwwroot/ | grep -E '\.(js|css|html|json)$'" || echo "No React files found in root"
          
          # CRITICAL: Check for Azure Key Vault files (should NOT exist)
          echo "🔍 Checking for Azure Key Vault files (should be NONE):"
          az webapp ssh --resource-group rg-dmc-app-dev --name dmc-app-dev --command "cd /home/site/wwwroot/backadm-dmc && find . -name '*KeyVault*' -o -name '*AzureKeyVault*' 2>/dev/null && echo '❌ WARNING: Azure Key Vault files found!' || echo '✅ SUCCESS: No Azure Key Vault files found'"
          
          # Check for clean Laravel services directory
          echo "🔍 Checking Laravel services directory:"
          az webapp ssh --resource-group rg-dmc-app-dev --name dmc-app-dev --command "cd /home/site/wwwroot/backadm-dmc && ls -la app/Services/ 2>/dev/null || echo 'No app/Services directory (expected for clean deployment)'"
          
          echo "✅ Structure verification completed!"

      - name: Post-deployment Laravel setup and optimization
        run: |
          echo "🔧 Running post-deployment Laravel setup on Azure..."
          
          # Create NGINX configuration for both React and Laravel
          az webapp ssh --resource-group rg-dmc-app-dev --name dmc-app-dev --command 'echo "server {
              listen 8080;
              listen [::]:8080;
              root /home/site/wwwroot;
              index index.php index.html index.htm;
              server_name _;
              
              # Handle React frontend (root directory) - SPA routing
              location / {
                  try_files \$uri \$uri/ /index.html;
              }
              
              # Handle Laravel admin (subdirectory)
              location /backadm-dmc {
                  alias /home/site/wwwroot/backadm-dmc/public;
                  try_files \$uri \$uri/ @laravel;
                  
                  location ~ \.php\$ {
                      include fastcgi_params;
                      fastcgi_param SCRIPT_FILENAME \$request_filename;
                      fastcgi_pass 127.0.0.1:9000;
                  }
              }
              
              location @laravel {
                  rewrite /backadm-dmc/(.*)\$ /backadm-dmc/index.php?\$1 last;
              }
          }" > /home/site/nginx-default' || true

          # Copy NGINX configuration
          az webapp ssh --resource-group rg-dmc-app-dev --name dmc-app-dev --command "cp /home/site/nginx-default /etc/nginx/sites-available/default" || true
          
          # Test and reload NGINX
          az webapp ssh --resource-group rg-dmc-app-dev --name dmc-app-dev --command "nginx -t && service nginx reload" || true
          
          # Create necessary Laravel directories
          az webapp ssh --resource-group rg-dmc-app-dev --name dmc-app-dev --command "cd /home/site/wwwroot/backadm-dmc && mkdir -p storage/framework/{sessions,views,cache}" || true
          
          az webapp ssh --resource-group rg-dmc-app-dev --name dmc-app-dev --command "cd /home/site/wwwroot/backadm-dmc && mkdir -p storage/logs" || true
          
          az webapp ssh --resource-group rg-dmc-app-dev --name dmc-app-dev --command "cd /home/site/wwwroot/backadm-dmc && mkdir -p storage/app/{public,uploads}" || true
          
          az webapp ssh --resource-group rg-dmc-app-dev --name dmc-app-dev --command "cd /home/site/wwwroot/backadm-dmc && mkdir -p bootstrap/cache" || true
          
          # Set proper permissions for Linux
          az webapp ssh --resource-group rg-dmc-app-dev --name dmc-app-dev --command "cd /home/site/wwwroot/backadm-dmc && chmod -R 775 storage" || true
          
          az webapp ssh --resource-group rg-dmc-app-dev --name dmc-app-dev --command "cd /home/site/wwwroot/backadm-dmc && chmod -R 775 bootstrap/cache" || true
          
          # Clear all existing caches first
          az webapp ssh --resource-group rg-dmc-app-dev --name dmc-app-dev --command "cd /home/site/wwwroot/backadm-dmc && php artisan optimize:clear" || true
          
          # Create storage link
          az webapp ssh --resource-group rg-dmc-app-dev --name dmc-app-dev --command "cd /home/site/wwwroot/backadm-dmc && php artisan storage:link" || true
          
          # Laravel optimizations
          az webapp ssh --resource-group rg-dmc-app-dev --name dmc-app-dev --command "cd /home/site/wwwroot/backadm-dmc && php artisan config:cache" || true
          
          az webapp ssh --resource-group rg-dmc-app-dev --name dmc-app-dev --command "cd /home/site/wwwroot/backadm-dmc && php artisan route:cache" || true
          
          az webapp ssh --resource-group rg-dmc-app-dev --name dmc-app-dev --command "cd /home/site/wwwroot/backadm-dmc && php artisan view:cache" || true
          
          echo "✅ Post-deployment Laravel setup completed"

      - name: Restart Azure Web App
        run: |
          echo "🔄 Restarting Azure Web App..."
          az webapp restart --resource-group rg-dmc-app-dev --name dmc-app-dev
          echo "✅ Azure Web App restarted successfully"

      - name: Deployment Summary
        run: |
          echo "🎉 Enhanced selective deployment completed successfully!"
          echo ""
          echo "🌐 Application URLs:"
          echo "   React Frontend: https://dev.travclicks.com/"
          echo "   Laravel Admin:  https://dev.travclicks.com/backadm-dmc/"
          echo ""
          echo "✅ Enhanced deployment flow:"
          echo "   1. ✅ Code built and zipped"
          echo "   2. 🧹 Enhanced selective cleanup:"
          echo "      - 🗑️ DELETED: backadm-dmc/ folder (COMPLETELY)"
          echo "      - 🗑️ DELETED: default file"
          echo "      - 🗑️ DELETED: laravel-debug.php"  
          echo "      - 🗑️ DELETED: startup.sh"
          echo "      - 🗑️ DELETED: nginx-default file"
          echo "      - 💨 CLEARED: PHP opcache"
          echo "      - 💨 CLEARED: Composer cache"
          echo "      - 🛡️ PRESERVED: ALL React files in root"
          echo "   3. 🚀 Fresh Laravel deployed (without --clean)"
          echo "   4. 🔍 Verified NO Azure Key Vault files exist"
          echo "   5. 📁 Laravel directories created"
          echo "   6. 🔧 Proper permissions set"
          echo "   7. 🧹 Laravel caches cleared"
          echo "   8. 🔗 Storage link created"
          echo "   9. ⚡ Laravel optimizations applied"
          echo "   10. 🔄 Web app restarted"
          echo ""
          echo "🛡️ React files are completely safe!"
          echo "🚀 Azure Key Vault integration completely removed!"
