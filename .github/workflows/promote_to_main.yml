name: Build and Deploy PHP App to Azure Web App - dmc-app-dev

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: 📅 Checkout staging branch
        uses: actions/checkout@v4

      - name: 🧠 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: 🗒️ Check if composer.json exists
        id: check_files
        uses: andstor/file-existence-action@v1
        with:
          files: 'backadm-dmc/composer.json'

      - name: 🔧 Install Composer Globally
        run: |
          curl -sS https://getcomposer.org/installer | php
          mv composer.phar /usr/local/bin/composer

      - name: 📦 Run composer install if composer.json exists
        if: steps.check_files.outputs.files_exists == 'true'
        run: |
          cd backadm-dmc
          composer validate --no-check-publish
          composer install --prefer-dist --no-progress --no-dev --optimize-autoloader

      - name: ⚙️ Create startup script for Laravel and NGINX setup
        run: |
          cat > startup.sh << 'EOF'
          #!/bin/bash
          echo "🚀 Starting Laravel and NGINX setup..."
          # Remove only specific files
          rm -f /home/site/wwwroot/default
          rm -f /home/site/wwwroot/laravel-debug.php
          rm -f /home/site/wwwroot/startup.sh
          rm -f /home/site/wwwroot/backadm-dmc/app/Services/AzureKeyVaultService.php
          rm -f /home/site/wwwroot/backadm-dmc/app/Providers/KeyVaultServiceProvider.php
          # Clear OPcache
          if command -v php >/dev/null 2>&1; then
              php -r "if (function_exists('opcache_reset')) { opcache_reset(); }"
          fi
          # Clear Composer cache
          composer clear-cache || true
          # Configure NGINX for Laravel
          cat > /etc/nginx/sites-available/default << 'NGINX_EOF'
          server {
              listen 8080;
              root /home/site/wwwroot;
              index index.php index.html;
              server_name _;
              if ($http_x_forwarded_proto != "https") {
                  return 301 https://$host$request_uri;
              }
              location ^~ /backadm-dmc/ {
                  alias /home/site/wwwroot/backadm-dmc/public/;
                  index index.php;
                  try_files $uri $uri/ @backadm_dmc_fallback;
                  location ~ \.php$ {
                      include fastcgi_params;
                      fastcgi_param SCRIPT_FILENAME /home/site/wwwroot/backadm-dmc/public/index.php;
                      fastcgi_param SCRIPT_NAME /backadm-dmc/index.php;
                      fastcgi_param REQUEST_URI $request_uri;
                      fastcgi_param HTTPS on;
                      fastcgi_pass 127.0.0.1:9000;
                  }
              }
              location = /backadm-dmc {
                  return 301 $scheme://$host/backadm-dmc/;
              }
              location @backadm_dmc_fallback {
                  rewrite ^/backadm-dmc/(.*)$ /backadm-dmc/index.php last;
              }
              location / {
                  try_files $uri $uri/ =404;
              }
              location ~ \.php$ {
                  include fastcgi_params;
                  fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                  fastcgi_param HTTPS on;
                  fastcgi_pass 127.0.0.1:9000;
              }
              add_header X-Content-Type-Options nosniff;
              add_header X-Frame-Options SAMEORIGIN;
              add_header X-XSS-Protection "1; mode=block";
              add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
          }
          NGINX_EOF
          cp /etc/nginx/sites-available/default /etc/nginx/sites-enabled/default
          nginx -t && service nginx reload
          cd /home/site/wwwroot/backadm-dmc
          mkdir -p storage/framework/{sessions,views,cache/data}
          mkdir -p storage/{logs,app/public} bootstrap/cache
          chmod -R 775 storage bootstrap/cache
          php artisan optimize:clear || true
          php artisan storage:link || true
          if ! grep -q "APP_KEY=base64:" .env 2>/dev/null; then
              php artisan key:generate --force || true
          fi
          php artisan cache:clear || true
          php artisan route:clear || true
          php artisan view:clear || true
          php artisan optimize || true
          php artisan config:cache || true
          php artisan route:cache || true
          php artisan view:cache || true
          echo "✅ Laravel and NGINX setup completed"
          EOF
          chmod +x startup.sh

      - name: 📦 Create ZIP for deployment (follow previous excludes)
        run: |
          echo "📦 Creating release.zip from repo with excludes..."
          rm -f release.zip
          zip -r release.zip . \
            -x ".git/*" \
            -x "node_modules/*" \
            -x "tests/*" \
            -x "*.md" \
            -x ".github/*" \
            -x ".gitignore" \
            -x ".gitattributes" \
            -x ".editorconfig" \
            -x "phpunit.xml" \
            -x "vite.config.js" \
            -x "package*.json"

      - name: 🔐 Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 🔑 Fetch Kudu publishing credentials
        id: kudu
        run: |
          CREDS=$(az webapp deployment list-publishing-credentials \
            --resource-group rg-dmc-app-dev \
            --name dmc-app-dev \
            --query "{user:publishingUserName, pass:publishingPassword}" -o tsv)
          USER=$(echo "$CREDS" | awk '{print $1}')
          PASS=$(echo "$CREDS" | awk '{print $2}')
          if [ -z "$USER" ] || [ -z "$PASS" ]; then echo "❌ Failed to fetch Kudu creds"; exit 1; fi
          echo "user=$USER" >> $GITHUB_OUTPUT
          echo "pass=$PASS" >> $GITHUB_OUTPUT

      - name: 🚀 Deploy backadm-dmc via Kudu ZIP push (non-destructive)
        env:
          APP_NAME: dmc-app-dev
          KUDU_USER: ${{ steps.kudu.outputs.user }}
          KUDU_PASS: ${{ steps.kudu.outputs.pass }}
        run: |
          set -e
          echo "🌐 Getting Kudu SCM URL..."
          SCM_URL=$(az webapp show --name "$APP_NAME" --resource-group rg-dmc-app-dev --query scmUrl -o tsv)
          echo "✅ Using Kudu URL: $SCM_URL"
          echo "🚀 Uploading laravel backadm-dmc zip to Kudu subfolder..."
          for i in 1 2 3; do 
            curl -sS -u "$KUDU_USER:$KUDU_PASS" -X PUT \
              "$SCM_URL/api/zip/backadm-dmc" \
              -H "Content-Type: application/zip" --data-binary @release.zip && break || sleep 2; 
          done

      - name: ⚙️ Configure startup file to run uploaded script
        env:
          APP_NAME: dmc-app-dev
          KUDU_USER: ${{ steps.kudu.outputs.user }}
          KUDU_PASS: ${{ steps.kudu.outputs.pass }}
        run: |
          SCM_URL=$(az webapp show --name "$APP_NAME" --resource-group rg-dmc-app-dev --query scmUrl -o tsv)
          curl -sS -u "$KUDU_USER:$KUDU_PASS" -X POST \
            "$SCM_URL/api/command" \
            -H "Content-Type:text/plain" \
            -d "chmod +x /home/site/wwwroot/startup.sh && echo done"

      - name: 🗂️ Ensure storage directories exist with write permissions (immediate)
        env:
          APP_NAME: dmc-app-dev
          KUDU_USER: ${{ steps.kudu.outputs.user }}
          KUDU_PASS: ${{ steps.kudu.outputs.pass }}
        run: |
          SCM_URL=$(az webapp show --name "$APP_NAME" --resource-group rg-dmc-app-dev --query scmUrl -o tsv)
          CMD='set -e; cd /home/site/wwwroot/backadm-dmc; \
          mkdir -p storage/app/public storage/logs storage/framework/cache storage/framework/sessions storage/framework/testing storage/framework/views bootstrap/cache; \
          touch storage/logs/laravel.log; \
          chmod -R 775 storage bootstrap/cache || true; \
          php artisan storage:link || true'
          curl -sS -u "$KUDU_USER:$KUDU_PASS" -X POST \
            "$SCM_URL/api/command" \
            -H "Content-Type:text/plain" \
            -d "$CMD"

      - name: 🔄 Restart Azure Web App
        run: |
          az webapp restart --resource-group rg-dmc-app-dev --name dmc-app-dev

      - name: ✅ Verify Laravel endpoint
        run: |
          sleep 10
          curl -f https://dev.travclicks.com/backadm-dmc/ || echo "Application may still be starting"

      - name: 📦 Deployment Summary
        run: |
          echo "🎉 Deployment finished!"
          echo "🌍 App URL: https://dev.travclicks.com/backadm-dmc"
          echo "✔️ Deployed only backadm-dmc; React at root preserved"
          echo "🛠️ Storage directories ensured and permissions attempted via Kudu"
          echo "📆 Deploy triggered by push to staging branch"

