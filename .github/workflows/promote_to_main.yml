name: Build and Deploy PHP App to Azure Web App - dmc-app-dev

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: 📅 Checkout staging branch
        uses: actions/checkout@v4

      - name: 🧠 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: 🗒️ Check if composer.json exists
        id: check_files
        uses: andstor/file-existence-action@v1
        with:
          files: 'backadm-dmc/composer.json'

      - name: 🔧 Install Composer Globally
        run: |
          curl -sS https://getcomposer.org/installer | php
          mv composer.phar /usr/local/bin/composer

      - name: 📦 Run composer install if composer.json exists
        if: steps.check_files.outputs.files_exists == 'true'
        run: |
          cd backadm-dmc
          composer validate --no-check-publish
          composer install --prefer-dist --no-progress --no-dev --optimize-autoloader

      - name: 📦 Create ZIP for deployment
        run: |
          zip -r release.zip . \
            -x ".git/*" \
            -x "node_modules/*" \
            -x "tests/*" \
            -x "*.md" \
            -x ".github/*" \
            -x ".gitignore" \
            -x ".gitattributes" \
            -x ".editorconfig" \
            -x "phpunit.xml" \
            -x "vite.config.js" \
            -x "package*.json"

      - name: 🔐 Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 🚀 Deploy Laravel + React ZIP
        run: |
          az webapp deploy \
            --resource-group rg-dmc-app-dev \
            --name dmc-app-dev \
            --src-path release.zip \
            --type zip

      - name: ⚙️ Create startup.sh on server
        run: |
          cat > /home/site/wwwroot/startup.sh << 'EOF'
          #!/bin/bash
          echo "🔧 Configuring NGINX and Laravel for Azure App Service..."

          # Copy custom NGINX config
          cp /home/site/wwwroot/default /etc/nginx/sites-available/default
          cp /home/site/wwwroot/default /etc/nginx/sites-enabled/default

          # Set Laravel permissions
          chmod -R 777 /home/site/wwwroot/backadm-dmc/storage
          chmod -R 777 /home/site/wwwroot/backadm-dmc/bootstrap/cache

          # Ensure directories exist
          mkdir -p /home/site/wwwroot/backadm-dmc/storage/framework/{views,cache/data,sessions}
          mkdir -p /home/site/wwwroot/backadm-dmc/storage/{logs,app/public}
          mkdir -p /home/site/wwwroot/backadm-dmc/bootstrap/cache
          chmod -R 777 /home/site/wwwroot/backadm-dmc/storage
          chmod -R 777 /home/site/wwwroot/backadm-dmc/bootstrap/cache

          cd /home/site/wwwroot/backadm-dmc

          # Update .env for HTTPS
          sed -i 's|APP_URL=.*|APP_URL=https://dev.travclicks.com|g' .env || echo "Could not update APP_URL"
          if ! grep -q "APP_ENV=" .env 2>/dev/null; then echo "APP_ENV=production" >> .env; fi
          if ! grep -q "APP_DEBUG=" .env 2>/dev/null; then echo "APP_DEBUG=false" >> .env; fi
          if ! grep -q "FORCE_HTTPS=" .env 2>/dev/null; then echo "FORCE_HTTPS=true" >> .env; fi
          if ! grep -q "ASSET_URL=" .env 2>/dev/null; then echo "ASSET_URL=https://dev.travclicks.com/backadm-dmc" >> .env; fi

          export APP_URL="https://dev.travclicks.com"
          export ASSET_URL="https://dev.travclicks.com/backadm-dmc"
          export APP_ENV="production"
          export FORCE_HTTPS="true"
          export HTTPS="on"
          export SERVER_PORT="443"

          # Generate app key if missing
          if ! grep -q "APP_KEY=base64:" .env 2>/dev/null; then
              php artisan key:generate --force || echo "Key generation failed"
          fi

          # Clear and cache Laravel
          php artisan config:clear || true
          php artisan cache:clear || true
          php artisan view:clear || true
          php artisan route:clear || true
          php artisan config:cache || true

          # Test NGINX
          nginx -t && service nginx reload

          echo "🎯 Laravel app should now be accessible at /backadm-dmc/"
          EOF

          chmod +x /home/site/wwwroot/startup.sh

      - name: ⚙️ Set startup script in Azure
        run: |
          az webapp config set \
            --resource-group rg-dmc-app-dev \
            --name dmc-app-dev \
            --startup-file "/home/site/wwwroot/startup.sh"

      - name: 🔄 Restart Azure Web App
        run: |
          az webapp restart --resource-group rg-dmc-app-dev --name dmc-app-dev

      - name: ✅ Verify Deployment
        run: |
          sleep 30
          curl -f https://dev.travclicks.com/backadm-dmc/ || echo "Application may still be starting"

      - name: 📦 Deployment Summary
        run: |
          echo "🎉 Deployment finished!"
          echo "🌍 App URL: https://dev.travclicks.com/backadm-dmc"
          echo "✔️ Laravel ready, React preserved, NGINX optimized"
          echo "🔄 NGINX routes Laravel under /backadm-dmc and React at root"
          echo "🔎 Laravel caches cleared, storage linked, key generated"
          echo "🛠️ All Laravel directories created and permissioned"
          echo "🚀 Production-ready optimization: route, view, and config cached"
          echo "📆 Deploy triggered by push to staging branch"
