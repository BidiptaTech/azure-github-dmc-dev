name: 🚀 Build & Deploy Laravel + React to Azure Web App - dmc-app-dev

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      # 1️⃣ Checkout staging branch
      - name: 📅 Checkout staging branch
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # 3️⃣ Setup PHP
      - name: 🔧 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      # 4️⃣ Install Composer globally
      - name: 🔧 Install Composer Globally
        run: |
          curl -sS https://getcomposer.org/installer | php
          sudo mv composer.phar /usr/local/bin/composer

      # 5️⃣ Install Laravel dependencies
      - name: 📦 Install Laravel Dependencies
        working-directory: backadm-dmc
        run: |
          composer validate --no-check-publish
          composer install --prefer-dist --no-dev --optimize-autoloader

      # 6️⃣ Install React dependencies & build
      - name: 🏗️ Build React Application
        run: |
          npm ci
          npm install @vitejs/plugin-react --save-dev || echo "Plugin already installed"
          npm rebuild @swc/core || echo "SWC rebuild failed, continuing..."
          rm -rf build dist
          npm run build

      # 7️⃣ Backup original vite config (optional)
      - name: 🔧 Backup Vite config
        run: |
          cp vite.config.js vite.config.js.backup || echo "No vite config to backup"

      # 8️⃣ Prepare deployment package
      - name: 📦 Prepare deployment package
        run: |
          mkdir -p deployment
          # Copy React build to root
          cp -r build/* deployment/
          # Copy Laravel backend
          cp -r backadm-dmc deployment/backadm-dmc
          # Copy public folder files
          if [ -d public ]; then cp -r public/* deployment/ 2>/dev/null || true; fi
          # Copy custom root-level files
          for file in laravel-debug.php startup.sh default .htaccess .user.ini; do
            [ -f "$file" ] && cp "$file" deployment/ && echo "✅ Copied $file"
          done
          cd deployment
          zip -r ../release.zip . -x "*.git*" -x "node_modules/*" -x "*.md" -x ".github/*" -x "vite.config.js" -x "package*.json"
          cd ..

      # 9️⃣ Azure login
      - name: 🔐 Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 🔟 Deploy zip to Azure Web App
      - name: 🚀 Deploy to Azure Web App
        run: |
          az webapp deploy \
            --resource-group rg-dmc-app-dev \
            --name dmc-app-dev \
            --src-path release.zip \
            --type zip

      # 1️⃣1️⃣ Create startup script for Laravel + basic NGINX tasks
      - name: ⚙️ Create startup.sh
        run: |
          cat > startup.sh << 'EOF'
          #!/bin/bash
          echo "🚀 Running Laravel startup tasks..."
          cd /home/site/wwwroot/backadm-dmc
          
          # Create storage & bootstrap directories
          mkdir -p storage/framework/{cache,sessions,views}
          mkdir -p storage/{logs,app/public} bootstrap/cache
          chmod -R 775 storage bootstrap/cache

          # Laravel optimizations
          php artisan storage:link || true
          if ! grep -q "APP_KEY=base64:" .env 2>/dev/null; then
              php artisan key:generate --force || true
          fi
          php artisan optimize:clear || true
          php artisan cache:clear || true
          php artisan config:cache || true
          php artisan route:cache || true
          php artisan view:cache || true
          echo "✅ Laravel startup tasks completed"
          EOF
          chmod +x startup.sh

      # 1️⃣2️⃣ Set Azure startup command
      - name: ⚙️ Set Azure startup command
        run: |
          az webapp config set \
            --resource-group rg-dmc-app-dev \
            --name dmc-app-dev \
            --startup-file '/home/site/wwwroot/startup.sh'

      # 1️⃣3️⃣ Restart Azure Web App
      - name: 🔄 Restart Azure Web App
        run: az webapp restart --resource-group rg-dmc-app-dev --name dmc-app-dev

      # 1️⃣4️⃣ Verify deployment
      - name: ✅ Verify Deployment
        run: |
          sleep 30
          curl -f https://dev.travclicks.com/backadm-dmc/ || echo "Laravel may still be starting"
          curl -f https://dev.travclicks.com/ || echo "React may still be starting"

      # 1️⃣5️⃣ Deployment summary
      - name: 📦 Deployment Summary
        run: |
          echo "🎉 Deployment finished!"
          echo "🌍 App URL: https://dev.travclicks.com/"
          echo "✔️ Laravel backend deployed to /backadm-dmc"
          echo "✔️ React frontend preserved at root"
          echo "✔️ Storage directories created, permissions set"
          echo "✔️ Laravel caches cleared and optimized"
          echo "✔️ Custom files deployed (.htaccess, startup.sh, laravel-debug.php, default)"
