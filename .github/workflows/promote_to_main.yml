name: Build and Deploy PHP App to Azure Web App - dmc-app-dev

on:
  push:
    branches:
      - staging
  pull_request:
    types: [closed]
    branches:
      - staging
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Only run if it's a push to staging OR a merged PR to staging
    if: |
      github.event_name == 'push' || 
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    permissions:
      contents: read
      id-token: write

    steps:
      - name: 🎯 Debug Trigger Information
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Actor: ${{ github.actor }}"
          echo "Triggering Actor: ${{ github.triggering_actor }}"
          echo "Repository: ${{ github.repository }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Run Number: ${{ github.run_number }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PR Merged: ${{ github.event.pull_request.merged }}"
            echo "Base Branch: ${{ github.event.pull_request.base.ref }}"
            echo "Head Branch: ${{ github.event.pull_request.head.ref }}"
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Push Ref: ${{ github.event.ref }}"
            echo "Before SHA: ${{ github.event.before }}"
            echo "After SHA: ${{ github.event.after }}"
            echo "Pusher Name: ${{ github.event.pusher.name }}"
            echo "Pusher Email: ${{ github.event.pusher.email }}"
          fi
          echo "=== Environment Variables ==="
          env | grep GITHUB_ | sort

      - name: 📅 Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0  # Fetch full history for better debugging

      - name: 🔍 Git History Debug
        run: |
          echo "=== Current Branch ==="
          git branch -a
          echo "=== Latest 5 commits ==="
          git log --oneline -5
          echo "=== Staging branch status ==="
          git show-branch staging

      - name: 🧠 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: 🗒️ Check if composer.json exists
        id: check_files
        uses: andstor/file-existence-action@v1
        with:
          files: 'backadm-dmc/composer.json'

      - name: 🔧 Install Composer Globally
        run: |
          curl -sS https://getcomposer.org/installer | php
          mv composer.phar /usr/local/bin/composer
          
      - name: 📦 Run composer install if composer.json exists
        if: steps.check_files.outputs.files_exists == 'true'
        run: |
          cd backadm-dmc
          composer validate --no-check-publish
          composer install --prefer-dist --no-progress --no-dev --optimize-autoloader

      - name: 📦 Create ZIP for deployment
        run: |
          zip -r release.zip . \
            -x ".git/*" \
            -x "node_modules/*" \
            -x "tests/*" \
            -x "*.md" \
            -x ".github/*" \
            -x ".gitignore" \
            -x ".gitattributes" \
            -x ".editorconfig" \
            -x "phpunit.xml" \
            -x "vite.config.js" \
            -x "package*.json"

      - name: 🔐 Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 🚀 Deploy to Azure Web App (preserving React files)
        run: |
          az webapp deploy \
            --resource-group rg-dmc-app-dev \
            --name dmc-app-dev \
            --src-path release.zip \
            --type zip

      - name: ⚙️ Create startup script for Laravel and NGINX setup
        run: |
          cat > startup.sh << 'EOF'
          #!/bin/bash
          echo "🚀 Starting Laravel and NGINX setup..."

          # Remove only specific files
          rm -f /home/site/wwwroot/default
          rm -f /home/site/wwwroot/laravel-debug.php
          rm -f /home/site/wwwroot/startup.sh
          rm -f /home/site/wwwroot/backadm-dmc/app/Services/AzureKeyVaultService.php
          rm -f /home/site/wwwroot/backadm-dmc/app/Providers/KeyVaultServiceProvider.php

          # Clear OPcache
          if command -v php >/dev/null 2>&1; then
              php -r "if (function_exists('opcache_reset')) { opcache_reset(); }"
          fi

          # Clear Composer cache
          composer clear-cache || true

          # Configure NGINX for Laravel
          cat > /etc/nginx/sites-available/default << 'NGINX_EOF'
          server {
              listen 8080;
              root /home/site/wwwroot;
              index index.php index.html;
              server_name _;

              if ($http_x_forwarded_proto != "https") {
                  return 301 https://$host$request_uri;
              }

              location ^~ /backadm-dmc/ {
                  alias /home/site/wwwroot/backadm-dmc/public/;
                  index index.php;
                  try_files $uri $uri/ @backadm_dmc_fallback;

                  location ~ \.php$ {
                      include fastcgi_params;
                      fastcgi_param SCRIPT_FILENAME /home/site/wwwroot/backadm-dmc/public/index.php;
                      fastcgi_param SCRIPT_NAME /backadm-dmc/index.php;
                      fastcgi_param REQUEST_URI $request_uri;
                      fastcgi_param HTTPS on;
                      fastcgi_pass 127.0.0.1:9000;
                  }
              }

              location = /backadm-dmc {
                  return 301 $scheme://$host/backadm-dmc/;
              }

              location @backadm_dmc_fallback {
                  rewrite ^/backadm-dmc/(.*)$ /backadm-dmc/index.php last;
              }

              location / {
                  try_files $uri $uri/ =404;
              }

              location ~ \.php$ {
                  include fastcgi_params;
                  fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                  fastcgi_param HTTPS on;
                  fastcgi_pass 127.0.0.1:9000;
              }

              add_header X-Content-Type-Options nosniff;
              add_header X-Frame-Options SAMEORIGIN;
              add_header X-XSS-Protection "1; mode=block";
              add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
          }
          NGINX_EOF

          cp /etc/nginx/sites-available/default /etc/nginx/sites-enabled/default
          nginx -t && service nginx reload

          cd /home/site/wwwroot/backadm-dmc

          mkdir -p storage/framework/{sessions,views,cache/data}
          mkdir -p storage/{logs,app/public} bootstrap/cache

          chmod -R 775 storage bootstrap/cache

          php artisan optimize:clear || true
          php artisan storage:link || true

          if ! grep -q "APP_KEY=base64:" .env 2>/dev/null; then
              php artisan key:generate --force || true
          fi

          # 💡 Insert clear and optimize commands here
          php artisan cache:clear || true
          php artisan route:clear || true
          php artisan view:clear || true
          php artisan optimize || true

          
          php artisan config:cache || true
          php artisan route:cache || true
          php artisan view:cache || true

          echo "✅ Laravel and NGINX setup completed"
          EOF

          chmod +x startup.sh

      - name: 📄 Upload and run startup script
        run: |
          az webapp deploy \
            --resource-group rg-dmc-app-dev \
            --name dmc-app-dev \
            --src-path startup.sh \
            --type startup

      - name: 🔄 Restart Azure Web App
        run: |
          az webapp restart --resource-group rg-dmc-app-dev --name dmc-app-dev

      - name: ✅ Verify Deployment
        run: |
          sleep 30
          curl -f https://dev.travclicks.com/backadm-dmc/ || echo "Application may still be starting"

      - name: 📦 Deployment Summary
        run: |
          echo "🎉 Deployment finished!"
          echo "🌍 App URL: https://dev.travclicks.com/backadm-dmc"
          echo "✔️ Laravel ready, React preserved, NGINX optimized"
          echo "🚫 Azure Key Vault removed, HTTPS enforced"
          echo "🔄 NGINX routes Laravel under /backadm-dmc and React at root"
          echo "🔎 Laravel caches cleared, storage linked, key generated"
          echo "🛠️ All Laravel directories created and permissioned"
          echo "🔋 OPcache and Composer cache cleared for clean run"
          echo "🚀 Production-ready optimization: route, view, and config cached"
          echo "🚧 Secure headers and HTTPS enforced by NGINX"
          echo "📆 Deploy triggered by: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "📋 PR: #${{ github.event.pull_request.number }} from ${{ github.event.pull_request.head.ref }}"
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "🔄 Push from: ${{ github.event.pusher.name }} (${{ github.event.pusher.email }})"
          fi
