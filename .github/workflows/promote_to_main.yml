name: Build and Deploy PHP App to Azure Web App - dmc-app-dev

on:
  push:
    branches:
      - staging
  workflow_dispatch:
 
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      # 1️⃣ Checkout staging branch
      - name: 📅 Checkout staging branch
        uses: actions/checkout@v4

      # 2️⃣ Setup PHP
      - name: 🧠 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      # 3️⃣ Check if composer.json exists
      - name: 🗒️ Check if composer.json exists
        id: check_files
        uses: andstor/file-existence-action@v1
        with:
          files: 'backadm-dmc/composer.json'

      # 4️⃣ Install Composer globally
      - name: 🔧 Install Composer Globally
        run: |
          curl -sS https://getcomposer.org/installer | php
          mv composer.phar /usr/local/bin/composer

      # 5️⃣ Run composer install if composer.json exists
      - name: 📦 Run composer install
        if: steps.check_files.outputs.files_exists == 'true'
        run: |
          cd backadm-dmc
          composer validate --no-check-publish
          composer install --prefer-dist --no-progress --no-dev --optimize-autoloader

      # 6️⃣ Create ZIP for deployment
      - name: 📦 Create deployment ZIP
        run: |
          zip -r release.zip . \
            -x ".git/*" \
            -x "node_modules/*" \
            -x "tests/*" \
            -x "*.md" \
            -x ".github/*" \
            -x ".gitignore" \
            -x ".gitattributes" \
            -x ".editorconfig" \
            -x "phpunit.xml" \
            -x "vite.config.js" \
            -x "package*.json"

      # 7️⃣ Login to Azure
      - name: 🔐 Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 8️⃣ Warm up Azure Kudu
      - name: 🧊 Warm up Azure Kudu
        run: |
          echo "Warming up Kudu..."
          curl -s -o /dev/null -w "%{http_code}" https://dmc-app-dev.scm.southeastasia-01.azurewebsites.net/api/settings || true
          echo "Kudu is awake."

      # 9️⃣ Enable Run From Package
      - name: ⚡ Enable Run From Package
        run: |
          az webapp config appsettings set \
            --resource-group rg-dmc-app-dev \
            --name dmc-app-dev \
            --settings WEBSITE_RUN_FROM_PACKAGE=1

      # 🔟 Deploy the ZIP to Azure
      - name: 🚀 Deploy to Azure Web App
        run: |
          az webapp deploy \
            --resource-group rg-dmc-app-dev \
            --name dmc-app-dev \
            --src-path release.zip \
            --type zip \
            --restart true

      # 1️⃣1️⃣ Create startup.sh for Laravel + NGINX
      - name: ⚙️ Create startup script
        run: |
          cat > startup.sh << 'EOF'
#!/bin/bash
echo "🔧 Configuring NGINX and Laravel for Azure App Service..."

# Set Laravel permissions
chmod -R 777 /home/site/wwwroot/backadm-dmc/storage
chmod -R 777 /home/site/wwwroot/backadm-dmc/bootstrap/cache

# Ensure directories exist
mkdir -p /home/site/wwwroot/backadm-dmc/storage/framework/{views,cache/data,sessions}
mkdir -p /home/site/wwwroot/backadm-dmc/storage/{logs,app/public}
mkdir -p /home/site/wwwroot/backadm-dmc/bootstrap/cache

# Laravel environment and HTTPS fixes
cd /home/site/wwwroot/backadm-dmc
if ! grep -q "APP_URL=https://" .env 2>/dev/null; then
  sed -i 's|APP_URL=.*|APP_URL=https://dev.travclicks.com|g' .env || echo "Could not update APP_URL"
fi

# Generate APP_KEY if missing
if ! grep -q "APP_KEY=base64:" .env 2>/dev/null; then
  php artisan key:generate --force || true
fi

# Clear Laravel caches and optimize
php artisan cache:clear || true
php artisan config:clear || true
php artisan route:clear || true
php artisan view:clear || true
php artisan optimize || true
php artisan config:cache || true
php artisan route:cache || true
php artisan view:cache || true

# Test NGINX
nginx -t && service nginx reload

echo "✅ Laravel + NGINX setup completed"
EOF

          chmod +x startup.sh

      # 1️⃣2️⃣ Deploy startup.sh
      - name: 📄 Upload startup.sh as startup command
        run: |
          az webapp deploy \
            --resource-group rg-dmc-app-dev \
            --name dmc-app-dev \
            --src-path startup.sh \
            --type startup

      # 1️⃣3️⃣ Restart Web App
      - name: 🔄 Restart Azure Web App
        run: |
          az webapp restart --resource-group rg-dmc-app-dev --name dmc-app-dev

      # 1️⃣4️⃣ Verify Deployment
      - name: ✅ Verify Deployment
        run: |
          sleep 30
          curl -f https://dev.travclicks.com/backadm-dmc/ || echo "Application may still be starting"

      # 1️⃣5️⃣ Deployment Summary
      - name: 📦 Deployment Summary
        run: |
          echo "🎉 Deployment finished!"
          echo "🌍 App URL: https://dev.travclicks.com/backadm-dmc"
          echo "✔️ Laravel ready, React preserved, NGINX optimized"
          echo "🔄 Startup script executed via Azure"
          echo "🔒 HTTPS enforced and storage permissions set"
