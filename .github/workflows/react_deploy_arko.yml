name: React Deploy Arko
on:
  push:
    branches:
      - arko
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Build React App
        run: npm run build

      - name: Clean staging root (except .htaccess & backadm-dmc)
        run: |
          find staging -mindepth 1 -maxdepth 1 ! -name '.htaccess' ! -name 'backadm-dmc' -exec rm -rf {} +

      - name: Deploy React build
        run: rsync -av ./build/ staging/
