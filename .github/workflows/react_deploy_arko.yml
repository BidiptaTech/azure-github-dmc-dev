name: Push Arko to Design Staging

on:
  push:
    branches:
      - arko

permissions:
  contents: write
  actions: read

jobs:
  push-to-design-staging:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 📥 Checkout Arko branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: 🔄 Push to Design Staging branch
        run: |
          echo "🔄 Pushing code from arko to design_staging branch (excluding .github folder)..."
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          # Create a temporary directory for the sync
          mkdir -p /tmp/sync-folder
          
          # Copy all files except .github folder to temp directory
          rsync -av --exclude='.github' --exclude='.git' ./ /tmp/sync-folder/
          
          # Fetch and checkout design_staging branch (create if doesn't exist)
          git fetch origin design_staging || echo "design_staging branch doesn't exist yet"
          git checkout design_staging || git checkout -b design_staging
          
          # Remove all files except .github and .git
          find . -maxdepth 1 -not -name '.github' -not -name '.git' -not -name '.' -not -name '..' -exec rm -rf {} + 2>/dev/null || true
          
          # Copy synced files back (excluding .github)
          cp -r /tmp/sync-folder/* . 2>/dev/null || true
          
          # Stage all changes
          git add .
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            # Commit changes
            git commit -m "Auto-sync from arko branch (excluding .github folder) - $(date)"
            
            # Push to design_staging branch
            git push origin design_staging
            
            echo "✅ Code pushed to design_staging branch successfully"
          fi
          
          # Clean up
          rm -rf /tmp/sync-folder

      - name: 🔍 Debug - Check design_staging branch
        run: |
          echo "🔍 Checking design_staging branch status..."
          git log -1 --oneline design_staging || echo "Failed to get design_staging log"
          echo "Current branches:"
          git branch -a
          echo "Recent commits on design_staging:"
          git log --oneline -5 design_staging || echo "No commits on design_staging"

      - name: 🎉 Push Summary
        run: |
          echo "🎯 Code successfully pushed from arko to design_staging!"
          echo ""
          echo "📁 What happened:"
          echo "   → Code from arko branch copied to design_staging branch"
          echo "   → design_staging branch updated with latest changes"
          echo "   → Ready for deployment workflow from design_staging"
          echo ""
          echo "🔧 Next Steps:"
          echo "   → design_staging workflow will handle deployment to Azure"
          echo "   → You can now track changes in design_staging branch"
          echo "   → Future pulls can be done from design_staging branch"
          echo ""
          echo "🚨 If design_staging workflow doesn't trigger:"
          echo "   → Check GitHub Actions tab for both workflows"
          echo "   → Verify the design_staging workflow file exists"
          echo "   → Check if the push actually created new commits" 
