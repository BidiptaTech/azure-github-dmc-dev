name: Sync dev_staging into staging/backadm-dmc

on:
  push:
    branches:
      - dev_staging

permissions:
  contents: write  # ✅ REQUIRED for push to work

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev_staging
        uses: actions/checkout@v4
        with:
          ref: dev_staging
          path: dev_staging

      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: staging
          path: staging

      - name: Copy all files into staging/backadm-dmc (preserve .env etc.)
        run: |
          rsync -av --exclude='.git/' --exclude='node_modules/' dev_staging/ staging/backadm-dmc/

      - name: Commit and push to staging
        run: |
          cd staging
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add backadm-dmc
          git commit -m "Auto-sync from dev_staging to backadm-dmc on $(date)" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.STAGING_GH_PAT }}@github.com/${{ github.repository }} HEAD:staging
