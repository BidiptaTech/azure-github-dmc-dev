name: Laravel Deploy Nawaj to Staging

on:
  push:
    branches:
      - nawaj

permissions:
  contents: write
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Nawaj branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: 🧰 Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: 📦 Install Composer dependencies
        run: composer install --optimize-autoloader --no-dev || true

      - name: ⚙️ Laravel optimize (preparation only)
        run: |
          php artisan config:clear || true
          php artisan cache:clear || true
          php artisan route:clear || true
          php artisan view:clear || true
          echo "✅ Laravel preparation completed"

      - name: 📄 Sync flat Laravel codebase to dev_staging branch (no subfolder)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git clone --depth=1 --branch=dev_staging https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }} temp-dev-flat || \
          git clone --depth=1 https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }} temp-dev-flat

          cd temp-dev-flat
          git checkout dev_staging || git checkout -b dev_staging
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cd ..

          rsync -av \
            --exclude='temp-staging/' \
            --exclude='temp-dev-flat/' \
            --exclude='.git/' \
            --exclude='.github/' \
            . temp-dev-flat/

          cd temp-dev-flat

          # Set Git identity in temp-dev-flat repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit to dev_staging"
          else
            git commit -m "⬆️ Sync flat Laravel code from nawaj branch → dev_staging"
            git push origin dev_staging
            echo "✅ dev_staging updated with flat Laravel code"
          fi

      - name: 🔄 Setup Git and clone staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Clone the repository to get staging branch
          git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }} temp-staging
          cd temp-staging
          git checkout staging || git checkout -b staging
          cd ..

      - name: 🗂️ Prepare backadm-dmc directory in staging (preserve important files)
        run: |
          cd temp-staging
          
          # Create backadm-dmc directory if it doesn't exist
          mkdir -p backadm-dmc
          
          # Backup important files if they exist
          if [ -f backadm-dmc/.env ]; then
            cp backadm-dmc/.env ../temp_env_backup
            echo "✅ Backed up .env file"
          fi
          
          if [ -f backadm-dmc/.htaccess ]; then
            cp backadm-dmc/.htaccess ../temp_htaccess_backup
            echo "✅ Backed up .htaccess file"
          fi
          
          if [ -f backadm-dmc/public/.htaccess ]; then
            mkdir -p ../temp_public_backup
            cp backadm-dmc/public/.htaccess ../temp_public_backup/.htaccess
            echo "✅ Backed up public/.htaccess file"
          fi
          
          # Clean ONLY the backadm-dmc directory (not touching anything outside)
          echo "🧹 Cleaning backadm-dmc directory only..."
          rm -rf backadm-dmc/*
          rm -rf backadm-dmc/.[!.]* 2>/dev/null || true
          
          echo "✅ backadm-dmc directory cleaned (files outside backadm-dmc untouched)"
          
          # Keep web.config for IIS fallback support in Azure App Service
          if [ -f web.config ]; then
              echo "✅ web.config found and kept for IIS fallback support"
          else
              echo "⚠️ web.config not found - will rely on nginx configuration only"
          fi

      - name: 🚀 Copy Laravel codebase to staging/backadm-dmc
        run: |
          echo "📁 Copying Laravel application to staging/backadm-dmc..."
          
          # Copy all Laravel files from nawaj branch to staging/backadm-dmc
          # Exclude temp-staging directory and git files
          rsync -av \
            --exclude='temp-staging/' \
            --exclude='.git/' \
            --exclude='.github/' \
            . temp-staging/backadm-dmc/
          
          echo "✅ Laravel codebase copied to staging/backadm-dmc"

      - name: 🔧 Configure NGINX for Laravel routing
        run: |
          echo "🔧 Creating NGINX configuration for Laravel routing..."
          
          # Create NGINX default configuration for Laravel
          cat > temp-staging/default << 'EOF'
          server {
              listen 8080;
              listen [::]:8080;
              root /home/site/wwwroot;
              index index.php index.html index.htm;
              server_name _;

              # Increase client body size for large uploads
              client_max_body_size 100M;
              
              # Increase timeout values
              client_body_timeout 300s;
              client_header_timeout 300s;
              proxy_connect_timeout 300s;
              proxy_send_timeout 300s;
              proxy_read_timeout 300s;
              
              # Buffer settings for large requests
              client_body_buffer_size 1M;
              client_header_buffer_size 1k;
              large_client_header_buffers 4 16k;

              # Force HTTPS for all requests
              if ($http_x_forwarded_proto != "https") {
                  return 301 https://$host$request_uri;
              }

              # Handle /backadm-dmc requests - route to Laravel public folder
              location ^~ /backadm-dmc/ {
                  alias /home/site/wwwroot/backadm-dmc/public/;
                  index index.php;
                  try_files $uri $uri/ @backadm_dmc_fallback;
                  
                  # Handle PHP files in Laravel
                  location ~ \.php$ {
                      include fastcgi_params;
                      fastcgi_param SCRIPT_FILENAME /home/site/wwwroot/backadm-dmc/public/index.php;
                      fastcgi_param SCRIPT_NAME /backadm-dmc/index.php;
                      fastcgi_param REQUEST_URI $request_uri;
                      fastcgi_param HTTPS on;
                      fastcgi_param SERVER_PORT 443;
                      fastcgi_param HTTP_X_FORWARDED_PROTO https;
                      fastcgi_pass 127.0.0.1:9000;
                      
                      # Increase FastCGI timeouts
                      fastcgi_read_timeout 300;
                      fastcgi_send_timeout 300;
                      fastcgi_connect_timeout 300;
                      
                      # Increase buffer sizes
                      fastcgi_buffer_size 128k;
                      fastcgi_buffers 4 256k;
                      fastcgi_busy_buffers_size 256k;
                  }
              }
              
              # Handle exact /backadm-dmc (without trailing slash)
              location = /backadm-dmc {
                  return 301 $scheme://$host/backadm-dmc/;
              }
              
              # Fallback for Laravel routing - send everything to index.php
              location @backadm_dmc_fallback {
                  rewrite ^/backadm-dmc/(.*)$ /backadm-dmc/index.php last;
              }

              # Handle other requests normally
              location / {
                  try_files $uri $uri/ =404;
              }

              # Handle PHP files in root
              location ~ \.php$ {
                  include fastcgi_params;
                  fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                  fastcgi_param HTTPS on;
                  fastcgi_param SERVER_PORT 443;
                  fastcgi_param HTTP_X_FORWARDED_PROTO https;
                  fastcgi_pass 127.0.0.1:9000;
                  
                  # Increase FastCGI timeouts
                  fastcgi_read_timeout 300;
                  fastcgi_send_timeout 300;
                  fastcgi_connect_timeout 300;
                  
                  # Increase buffer sizes
                  fastcgi_buffer_size 128k;
                  fastcgi_buffers 4 256k;
                  fastcgi_busy_buffers_size 256k;
              }

              # Security headers
              add_header X-Content-Type-Options nosniff;
              add_header X-Frame-Options SAMEORIGIN;
              add_header X-XSS-Protection "1; mode=block";
              add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
          }
          EOF
          
          echo "✅ NGINX configuration created"

      - name: 🚀 Create startup script for NGINX
        run: |
          echo "🚀 Creating startup script for NGINX configuration..."
          
          cat > temp-staging/startup.sh << 'EOF'
          #!/bin/bash
          echo "🔧 Configuring NGINX and Laravel for Azure App Service..."
          
          # Copy our custom NGINX configuration
          cp /home/site/wwwroot/default /etc/nginx/sites-available/default
          cp /home/site/wwwroot/default /etc/nginx/sites-enabled/default
          
          # Set proper Laravel permissions
          echo "📁 Setting Laravel permissions..."
          chmod -R 777 /home/site/wwwroot/backadm-dmc/storage
          chmod -R 777 /home/site/wwwroot/backadm-dmc/bootstrap/cache
          
          # Ensure directories exist
          echo "📁 Ensuring Laravel directories exist..."
          mkdir -p /home/site/wwwroot/backadm-dmc/storage/framework/views
          mkdir -p /home/site/wwwroot/backadm-dmc/storage/framework/cache/data
          mkdir -p /home/site/wwwroot/backadm-dmc/storage/framework/sessions
          mkdir -p /home/site/wwwroot/backadm-dmc/storage/logs
          mkdir -p /home/site/wwwroot/backadm-dmc/bootstrap/cache
          
          # Set permissions again after creating directories
          chmod -R 777 /home/site/wwwroot/backadm-dmc/storage
          chmod -R 777 /home/site/wwwroot/backadm-dmc/bootstrap/cache
          
          # Navigate to Laravel directory
          cd /home/site/wwwroot/backadm-dmc
          
          # Configure Laravel for HTTPS (fix mixed content issues)
          echo "🔒 Configuring Laravel for HTTPS..."
          
          # Update .env for HTTPS if APP_URL is not set to HTTPS
          if ! grep -q "APP_URL=https://" .env 2>/dev/null; then
              echo "🔧 Setting APP_URL to HTTPS in .env..."
              sed -i 's|APP_URL=.*|APP_URL=https://dev.travclicks.com|g' .env || echo "Could not update APP_URL"
          fi
          
          # Ensure critical environment variables are set
          echo "🔧 Ensuring critical environment variables are set..."
          if ! grep -q "APP_ENV=" .env 2>/dev/null; then
              echo "APP_ENV=production" >> .env
          fi
          if ! grep -q "APP_DEBUG=" .env 2>/dev/null; then
              echo "APP_DEBUG=false" >> .env
          fi
          
          # Add HTTPS enforcement variables
          if ! grep -q "FORCE_HTTPS=" .env 2>/dev/null; then
              echo "FORCE_HTTPS=true" >> .env
          fi
          if ! grep -q "ASSET_URL=" .env 2>/dev/null; then
              echo "ASSET_URL=https://dev.travclicks.com/backadm-dmc" >> .env
          fi
          
          # Force HTTPS in Laravel configuration
          export APP_URL="https://dev.travclicks.com"
          export ASSET_URL="https://dev.travclicks.com/backadm-dmc"
          export APP_ENV="production"
          export FORCE_HTTPS="true"
          export HTTPS="on"
          export SERVER_PORT="443"
          
          # Generate application key if not set
          echo "🔑 Checking Laravel application key..."
          if ! grep -q "APP_KEY=base64:" .env 2>/dev/null; then
              echo "🔑 Generating Laravel application key..."
              php artisan key:generate --force || echo "Key generation failed (may already exist)"
          fi
          
          # Clear Laravel caches
          echo "🧹 Clearing Laravel caches..."
          php artisan config:clear || echo "Config clear failed (OK if no config cached)"
          php artisan cache:clear || echo "Cache clear failed (OK if no cache)"
          php artisan view:clear || echo "View clear failed (OK if no views cached)"
          php artisan route:clear || echo "Route clear failed (OK if no routes cached)"
          
          # Try to cache config for better performance
          echo "⚡ Optimizing Laravel..."
          php artisan config:cache || echo "Config cache failed (OK for development)"
          
          # Debug Laravel routes
          echo "🔍 Checking Laravel routes..."
          php artisan route:list --path=login || echo "Route list failed"
          
          # Test NGINX configuration
          echo "🔧 Testing NGINX configuration..."
          nginx -t
          if [ $? -eq 0 ]; then
              echo "✅ NGINX configuration is valid"
              service nginx reload
              echo "✅ NGINX reloaded successfully"
          else
              echo "❌ NGINX configuration error"
              exit 1
          fi
          
          echo "🎯 Laravel app should now be accessible at /backadm-dmc/"
          echo "🔒 HTTPS configuration applied to fix mixed content issues"
          echo "📁 Storage permissions: $(ls -la /home/site/wwwroot/backadm-dmc/storage | head -5)"
          echo "🔍 Debug URL: https://dev.travclicks.com/laravel-debug.php"
          EOF
          
          chmod +x temp-staging/startup.sh
          echo "✅ Startup script created and made executable"
          
          # Update AppServiceProvider to include HTTPS configuration
          if [ -f temp-staging/backadm-dmc/app/Providers/AppServiceProvider.php ]; then
              echo "🔧 Adding comprehensive HTTPS configuration to AppServiceProvider..."
              
              # Check if URL facade is already imported
              if ! grep -q "use Illuminate\\Support\\Facades\\URL;" temp-staging/backadm-dmc/app/Providers/AppServiceProvider.php; then
                  sed -i '/use Illuminate\\Support\\ServiceProvider;/a use Illuminate\\Support\\Facades\\URL;' temp-staging/backadm-dmc/app/Providers/AppServiceProvider.php
              fi
              
              # Add comprehensive HTTPS configuration to boot method
              if ! grep -q "URL::forceScheme" temp-staging/backadm-dmc/app/Providers/AppServiceProvider.php; then
                  sed -i '/public function boot()/,/^    }/ {
                      /^    }/ i\
                      \
                      // Force HTTPS URLs everywhere\
                      if (config("app.env") === "production" || isset($_SERVER["HTTPS"]) || request()->header("x-forwarded-proto") == "https") {\
                          URL::forceScheme("https");\
                          URL::forceRootUrl(config("app.url"));\
                      }\
                      \
                      // Set asset URL for subdirectory\
                      if (config("app.asset_url")) {\
                          URL::asset("/");\
                      }\
                      \
                      // Force HTTPS for all requests\
                      if (isset($_SERVER["HTTP_X_FORWARDED_PROTO"]) && $_SERVER["HTTP_X_FORWARDED_PROTO"] === "https") {\
                          request()->server->set("HTTPS", "on");\
                          request()->server->set("SERVER_PORT", 443);\
                      }
                  }' temp-staging/backadm-dmc/app/Providers/AppServiceProvider.php
              fi
              
              echo "✅ Comprehensive HTTPS configuration added to AppServiceProvider"
          else
              echo "⚠️ AppServiceProvider not found, will be handled by startup script"
          fi

      - name: 📁 Create missing Laravel directories
        run: |
          echo "📁 Creating missing Laravel directories..."
          
          # Create complete storage directory structure
          mkdir -p temp-staging/backadm-dmc/storage/app/public
          mkdir -p temp-staging/backadm-dmc/storage/framework/cache/data
          mkdir -p temp-staging/backadm-dmc/storage/framework/sessions
          mkdir -p temp-staging/backadm-dmc/storage/framework/views
          mkdir -p temp-staging/backadm-dmc/storage/framework/testing
          mkdir -p temp-staging/backadm-dmc/storage/logs
          
          # Create bootstrap/cache directory
          mkdir -p temp-staging/backadm-dmc/bootstrap/cache
          
          # Create placeholder files to ensure directories exist
          touch temp-staging/backadm-dmc/storage/logs/laravel.log
          touch temp-staging/backadm-dmc/storage/framework/sessions/.gitkeep
          touch temp-staging/backadm-dmc/storage/framework/views/.gitkeep
          touch temp-staging/backadm-dmc/storage/framework/cache/data/.gitkeep
          touch temp-staging/backadm-dmc/bootstrap/cache/.gitkeep
          
          # Set proper permissions (777 for Azure App Service)
          chmod -R 777 temp-staging/backadm-dmc/storage
          chmod -R 777 temp-staging/backadm-dmc/bootstrap/cache
          
          echo "✅ Laravel directories created with proper permissions"

      - name: 🔍 Create Laravel debug script
        run: |
          echo "🔧 Creating Laravel debug script..."
          
          # Create a debug script to help diagnose issues
          cat > temp-staging/laravel-debug.php << 'EOF'
          <?php
          echo "<h2>Laravel Debug Information</h2>";
          echo "<h3>PHP Information</h3>";
          echo "PHP Version: " . phpversion() . "<br>";
          echo "Current Working Directory: " . getcwd() . "<br>";
          echo "Script Path: " . __FILE__ . "<br>";
          
          echo "<h3>Directory Structure</h3>";
          $basePath = '/home/site/wwwroot/backadm-dmc';
          echo "Base Path: $basePath<br>";
          
          $dirs = [
              'storage',
              'storage/framework',
              'storage/framework/views',
              'storage/framework/cache',
              'storage/framework/sessions',
              'storage/logs',
              'bootstrap',
              'bootstrap/cache'
          ];
          
          foreach ($dirs as $dir) {
              $fullPath = $basePath . '/' . $dir;
              $exists = is_dir($fullPath) ? 'EXISTS' : 'MISSING';
              $writable = is_writable($fullPath) ? 'WRITABLE' : 'NOT WRITABLE';
              $perms = file_exists($fullPath) ? substr(sprintf('%o', fileperms($fullPath)), -4) : 'N/A';
              echo "$dir: $exists, $writable, Permissions: $perms<br>";
          }
          
          echo "<h3>Environment Variables</h3>";
          $envVars = ['APP_ENV', 'APP_DEBUG', 'APP_KEY', 'CACHE_DRIVER', 'SESSION_DRIVER'];
          foreach ($envVars as $var) {
              echo "$var: " . (getenv($var) ?: 'NOT SET') . "<br>";
          }
          
          echo "<h3>Laravel Bootstrap Test</h3>";
          try {
              if (file_exists($basePath . '/bootstrap/app.php')) {
                  echo "bootstrap/app.php exists<br>";
                  // Try to load Laravel
                  require_once $basePath . '/bootstrap/app.php';
                  echo "Laravel bootstrap loaded successfully<br>";
              } else {
                  echo "bootstrap/app.php NOT FOUND<br>";
              }
          } catch (Exception $e) {
              echo "Laravel bootstrap error: " . $e->getMessage() . "<br>";
              echo "Stack trace: <pre>" . $e->getTraceAsString() . "</pre>";
          }
          ?>
          EOF
          
          echo "✅ Laravel debug script created (existing .env file will be preserved)"

      - name: 🔧 Fix asset paths for subdirectory deployment
        run: |
          echo "🔧 Configuring Laravel asset paths for /backadm-dmc subdirectory..."
          
          # Create a custom asset helper or modify existing configuration
          cat > temp-staging/backadm-dmc/config/app_custom.php << 'EOF'
          <?php
          // Custom configuration for subdirectory deployment
          
          // Set the correct asset URL for subdirectory
          if (!function_exists('custom_asset')) {
              function custom_asset($path) {
                  return config('app.asset_url', config('app.url')) . '/' . ltrim($path, '/');
              }
          }
          
          // Override Laravel's asset helper
          if (!function_exists('asset_override')) {
              function asset_override($path) {
                  // For subdirectory deployment, ensure assets include the subdirectory path
                  $baseUrl = config('app.asset_url') ?: config('app.url');
                  
                  // If we're in a subdirectory, make sure the path includes it
                  if (strpos($baseUrl, '/backadm-dmc') !== false) {
                      return $baseUrl . '/' . ltrim($path, '/');
                  }
                  
                  return $baseUrl . '/' . ltrim($path, '/');
              }
          }
          EOF
          
          echo "✅ Custom asset configuration created for subdirectory deployment"

      - name: 🔧 Restore preserved files and set permissions
        run: |
          cd temp-staging/backadm-dmc
          
          # Restore backed up files
          if [ -f ../../temp_env_backup ]; then
            cp ../../temp_env_backup .env
            rm ../../temp_env_backup
            echo "✅ Restored .env file"
          fi
          
          if [ -f ../../temp_htaccess_backup ]; then
            cp ../../temp_htaccess_backup .htaccess
            rm ../../temp_htaccess_backup
            echo "✅ Restored .htaccess file"
          fi
          
          if [ -f ../../temp_public_backup/.htaccess ]; then
            cp ../../temp_public_backup/.htaccess public/.htaccess
            rm -rf ../../temp_public_backup
            echo "✅ Restored public/.htaccess file"
          fi
          
          echo "✅ Important files restored (permissions will be set by startup script)"

      - name: 📤 Commit and push to staging branch
        run: |
          cd temp-staging
          
          # Configure Git identity in the cloned repository
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add changes in backadm-dmc directory, NGINX configs, and scripts
          git add backadm-dmc/
          git add default 2>/dev/null || true
          git add startup.sh 2>/dev/null || true
          git add laravel-debug.php 2>/dev/null || true
          git add https-config.php 2>/dev/null || true
          git status
          
          if git diff --staged --quiet; then
            echo "No changes to commit in backadm-dmc directory"
          else
            git commit -m "🚀 Update backadm-dmc from nawaj branch - $(date '+%Y-%m-%d %H:%M:%S')

            ✅ Updated: staging/backadm-dmc/ ← nawaj branch Laravel code
            🔧 Added: NGINX configuration for Laravel routing
            🚀 Added: startup.sh script for NGINX setup
            📁 Created: missing Laravel directories (storage, bootstrap/cache)
            🔍 Added: Laravel debug script for troubleshooting
            🔒 Preserved: .env, .htaccess files in backadm-dmc/
            🛡️ Protected: All files outside backadm-dmc/ folder untouched"
            
            git push origin staging
            echo "✅ Successfully pushed to staging branch"
          fi

      - name: 🎉 Deployment Summary
        run: |
          echo "🎯 Laravel codebase updated in staging/backadm-dmc successfully!"
          echo ""
          echo "📁 Updated:"
          echo "   staging/backadm-dmc/ ← nawaj branch Laravel code"
          echo "   staging/default ← NGINX configuration for Laravel"
          echo "   staging/startup.sh ← NGINX setup script"
          echo ""
          echo "📦 Flat push also done:"
          echo "   → dev_staging ← nawaj branch code (flat structure, no subfolder)"
          echo ""
          echo "🔒 Preserved in staging/backadm-dmc/:"
          echo "   → .env file (if existed)"
          echo "   → .htaccess file (if existed)"
          echo "   → public/.htaccess file (if existed)"
          echo ""
          echo "🛡️ Protected:"
          echo "   → All files outside backadm-dmc/ folder remain untouched"
          echo ""
          echo "⚡ Next:"
          echo "   → Staging branch will deploy to Azure App Service"
          echo "   → Laravel app will be available at: https://dev.travclicks.com/backadm-dmc/" 
