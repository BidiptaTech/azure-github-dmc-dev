name: 🚀 Deploy UAT - Laravel + React to Azure (dmc-app-uat)

on:
  push:
    branches:
      - uat_main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: 🌐 Fullstack UAT Deployment
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js for React
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: 🔧 Setup PHP for Laravel
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2

      - name: 📦 Install Laravel Dependencies
        working-directory: backadm-dmc
        run: composer install --prefer-dist --no-dev --optimize-autoloader

      - name: ⚙️ Build React App
        run: |
          npm ci
          npm run build

      - name: 📁 Prepare Deployment Package
        run: |
          mkdir -p deployment
          cp -r build/* deployment/
          cp -r backadm-dmc deployment/backadm-dmc

          # Preserve custom root-level files if available
          for file in laravel-debug.php startup.sh default; do
            [ -f "$file" ] && cp "$file" deployment/
          done

      - name: 🔐 Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 🚀 Deploy to Azure Web App (dmc-app-uat)
        uses: azure/webapps-deploy@v3
        with:
          app-name: dmc-app-uat
          slot-name: Production
          package: ./deployment

      - name: 🛠️ Run Laravel Optimization via SSH
        run: |
          echo "⚙️ Running Laravel Artisan commands remotely..."
          az webapp ssh --name dmc-app-uat --resource-group rg-dmc-app-uat --command '
            cd /home/site/wwwroot/backadm-dmc &&
            php artisan cache:clear &&
            php artisan config:clear &&
            php artisan route:clear &&
            php artisan view:clear &&
            php artisan optimize &&
            php artisan config:cache &&
            php artisan route:cache &&
            php artisan view:cache
          '

      - name: 🔁 Restart Azure Web App
        run: az webapp restart --resource-group rg-dmc-app-uat --name dmc-app-uat

      - name: ✅ Deployment Summary
        run: |
          echo "✅ Laravel + React deployed to Azure from uat_main"
          echo "🔗 React: https://uat.travclicks.com/"
          echo "🔗 Laravel: https://uat.travclicks.com/backadm-dmc/"
