name: Sync Backend (dev_staging → staging)

on:
  push:
    branches:
      - dev_staging

jobs:
  sync-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev_staging
        uses: actions/checkout@v3
        with:
          ref: dev_staging

      - name: Set up Git
        run: |
          git config --global user.email "ci-bot@example.com"
          git config --global user.name "CI Bot"

      - name: Sync backadm-dmc folder to staging
        run: |
          git clone https://github.com/${{ github.repository }} repo
          cp -r backadm-dmc repo/backadm-dmc
          cd repo
          git checkout staging || git checkout -b staging
          git add backadm-dmc
          git commit -m "Sync backadm-dmc from dev_staging" || echo "No changes to commit"
          git push origin staging
